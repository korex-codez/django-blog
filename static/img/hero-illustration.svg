<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <title>Code Development Workspace</title>
  <desc>A modern flat illustration of a coding monitor with surrounding communication and feedback icons.</desc>

  <defs>
    <!-- Monitor Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2436"/>
      <stop offset="100%" stop-color="#0F1420"/>
    </linearGradient>

    <!-- Monitor Bezel Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8AFE"/>
      <stop offset="100%" stop-color="#2A6AF0"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.12"/>
    </filter>

    <!-- Glow Filter for Icons -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Decorative Background Dots (with subtle pulse) - Kept for aesthetic detail -->
  <circle cx="45" cy="30" r="3" fill="#CBD5E1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="455" cy="45" r="4" fill="#94A3B8" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="365" r="3" fill="#CBD5E1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="370" r="4" fill="#94A3B8" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- === MONITOR (with gentle float) === -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Stand Base -->
    <rect x="210" y="272" width="80" height="8" rx="4" fill="#1E293B"/>
    <!-- Stand Neck -->
    <rect x="230" y="260" width="40" height="16" rx="2" fill="#334155"/>

    <!-- Monitor Bezel -->
    <rect x="140" y="60" width="220" height="200" rx="16" fill="url(#bezelGrad)"/>
    <!-- Monitor Screen Inner Bezel -->
    <rect x="150" y="70" width="200" height="180" rx="10" fill="url(#screenGrad)"/>

    <!-- Code Lines -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Line 1 -->
      <line x1="165" y1="95" x2="215" y2="95" stroke="#34D399" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="0.1s" fill="freeze"/>
      </line>
      <line x1="222" y1="95" x2="245" y2="95" stroke="#FBBF24" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="0.2s" fill="freeze"/>
      </line>
      <line x1="252" y1="95" x2="280" y2="95" stroke="#60A5FA" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="0.3s" fill="freeze"/>
      </line>

      <!-- Line 2 -->
      <line x1="165" y1="115" x2="190" y2="115" stroke="#F87171" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="0.4s" fill="freeze"/>
      </line>
      <line x1="197" y1="115" x2="230" y2="115" stroke="#A78BFA" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="0.5s" fill="freeze"/>
      </line>
      <line x1="237" y1="115" x2="260" y2="115" stroke="#34D399" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="0.6s" fill="freeze"/>
      </line>

      <!-- Line 3 (With Cursor) -->
      <line x1="165" y1="135" x2="210" y2="135" stroke="#FBBF24" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="0.7s" fill="freeze"/>
      </line>
      <line x1="217" y1="135" x2="235" y2="135" stroke="#F472B6" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="0.8s" fill="freeze"/>
      </line>
      <!-- Blinking Cursor -->
      <rect x="240" y="128" width="3" height="14" fill="#E2E8F0" rx="1">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>

      <!-- Line 4 -->
      <line x1="165" y1="155" x2="205" y2="155" stroke="#60A5FA" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="0.9s" fill="freeze"/>
      </line>
      <line x1="212" y1="155" x2="250" y2="155" stroke="#34D399" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="1s" fill="freeze"/>
      </line>

      <!-- Line 5 -->
      <line x1="165" y1="175" x2="195" y2="175" stroke="#F87171" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="1.1s" fill="freeze"/>
      </line>
      <line x1="202" y1="175" x2="240" y2="175" stroke="#FBBF24" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="1.2s" fill="freeze"/>
      </line>
      <line x1="247" y1="175" x2="275" y2="175" stroke="#A78BFA" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="1.3s" fill="freeze"/>
      </line>

      <!-- Line 6 -->
      <line x1="165" y1="195" x2="220" y2="195" stroke="#34D399" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="1.4s" fill="freeze"/>
      </line>
      <line x1="227" y1="195" x2="255" y2="195" stroke="#60A5FA" stroke-width="5">
        <animate attributeName="stroke-opacity" values="0;1;1" dur="1s" begin="1.5s" fill="freeze"/>
      </line>
    </g>
  </g>

  <!-- === LEFT ICONS (with gentle float + pop) === -->
  <!-- Document Icon -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <rect x="75" y="90" width="35" height="45" rx="5" fill="#FFFFFF" stroke="#4F8AFE" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0;1;1" dur="0.5s" begin="0.1s" fill="freeze"/>
    </rect>
    <line x1="83" y1="105" x2="102" y2="105" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0;1;1" dur="0.5s" begin="0.2s" fill="freeze"/>
    </line>
    <line x1="83" y1="113" x2="102" y2="113" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0;1;1" dur="0.5s" begin="0.3s" fill="freeze"/>
    </line>
    <line x1="83" y1="121" x2="95" y2="121" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0;1;1" dur="0.5s" begin="0.4s" fill="freeze"/>
    </line>
  </g>

  <!-- User Profile Icon -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,4; 0,0" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <circle cx="85" cy="305" r="18" fill="#2563EB">
      <animate attributeName="r" values="16;18;16" dur="1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    </circle>
    <circle cx="85" cy="300" r="7" fill="#FFFFFF">
      <animate attributeName="r" values="0;7;7" dur="0.5s" begin="0.2s" fill="freeze"/>
    </circle>
    <path d="M71 317 C71 307, 99 307, 99 317 Z" fill="#FFFFFF">
      <animate attributeName="d" values="M71 325 C71 315, 99 315, 99 325 Z; M71 317 C71 307, 99 307, 99 317 Z; M71 317 C71 307, 99 307, 99 317 Z" dur="0.5s" begin="0.3s" fill="freeze"/>
    </path>
  </g>

  <!-- === RIGHT ICONS === -->
  <!-- Target/Bullseye Icon -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <circle cx="390" cy="130" r="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="3">
      <animate attributeName="r" values="0;16;16" dur="0.8s" begin="0.1s" fill="freeze"/>
    </circle>
    <circle cx="390" cy="130" r="6" fill="#2563EB">
      <animate attributeName="r" values="0;6;6" dur="0.5s" begin="0.4s" fill="freeze"/>
    </circle>
  </g>

  <!-- Chat Bubble Icon -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,4; 0,0" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <rect x="375" y="240" width="40" height="30" rx="6" fill="#FFFFFF" stroke="#4F8AFE" stroke-width="3">
      <animate attributeName="height" values="0;30;30" dur="0.6s" begin="0.1s" fill="freeze"/>
    </rect>
    <polygon points="395,270 390,282 385,270" fill="#FFFFFF" stroke="#4F8AFE" stroke-width="3" stroke-linejoin="round">
      <animate attributeName="opacity" values="0;1;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    </polygon>
    <line x1="385" y1="252" x2="405" y2="252" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0;1;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </line>
    <line x1="385" y1="260" x2="398" y2="260" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0;1;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    </line>
  </g>

  <!-- === BOTTOM ICONS === -->
  <!-- Heart Icon (Pulsing) -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,3; 0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M135 310 C135 303, 145 303, 145 310 C145 317, 135 325, 130 325 C125 325, 115 317, 115 310 C115 303, 125 303, 125 310" fill="#F43F5E" stroke="none">
      <animate attributeName="d" values="M135 310 C135 303, 145 303, 145 310 C145 317, 135 325, 130 325 C125 325, 115 317, 115 310 C115 303, 125 303, 125 310; M135 310 C135 300, 148 300, 148 310 C148 320, 135 330, 130 330 C125 330, 112 320, 112 310 C112 300, 125 300, 125 310; M135 310 C135 303, 145 303, 145 310 C145 317, 135 325, 130 325 C125 325, 115 317, 115 310 C115 303, 125 303, 125 310" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    </path>
  </g>

  <!-- Star Icon (Rotating) -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 305 343; 360 305 343" dur="12s" repeatCount="indefinite"/>
      <polygon points="305,330 308,340 318,340 310,346 313,356 305,350 297,356 300,346 292,340 302,340" fill="#FBBF24"/>
    </g>
  </g>
</svg>