{% extends "blog/base.html" %}
{% load static %}

{% block title %}Server Error - PixelPost{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="mb-4">
                <i class="fas fa-server fa-5x text-danger mb-4"></i>
                <h1 class="display-1 fw-bold text-danger">500</h1>
                <h2 class="mb-4">Internal Server Error</h2>
                <p class="lead text-muted">
                    Something went wrong on our end. We're working to fix it.
                </p>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h5><i class="fas fa-lightbulb me-2"></i>What you can do:</h5>
                    <div class="d-flex flex-wrap justify-content-center gap-3 mt-3">
                        <a href="{% url 'blog:home' %}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Go Home
                        </a>
                        <a href="{% url 'blog:contact' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-envelope me-2"></i>Report Issue
                        </a>
                        <a href="javascript:location.reload()" class="btn btn-outline-primary">
                            <i class="fas fa-sync me-2"></i>Refresh Page
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
