{% extends "blog/base.html" %}

{% block title %}
Edit Profile | My Blog
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        ✏ Edit Profile

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="text-center mb-4">

                            {% if profile.image %}

                            <img src="{{ profile.image.url }}"
                                 class="rounded-circle border border-3"
                                 style="width:180px;height:180px;object-fit:cover;">

                            {% else %}

                            <img src="https://via.placeholder.com/180"
                                 class="rounded-circle">

                            {% endif %}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Profile Picture

                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Bio

                            </label>

                            <textarea
                                name="bio"
                                rows="5"
                                class="form-control">{{ profile.bio }}</textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Website

                            </label>

                            <input
                                type="url"
                                name="website"
                                value="{{ profile.website }}"
                                class="form-control">

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success">

                            💾 Save Changes

                        </button>

                        <a href="{% url 'profile' %}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
