{% extends "blog/base.html" %}


{% block content %}


<h2>
Edit Profile
</h2>


<form method="POST"
enctype="multipart/form-data">


{% csrf_token %}


<label>
Profile Image
</label>

<input type="file"
name="image"
class="form-control mb-3">



<label>
Bio
</label>

<textarea
name="bio"
class="form-control mb-3">

{{ profile.bio }}

</textarea>



<button class="btn premium-btn">

Save Changes

</button>


</form>


{% endblock %}
