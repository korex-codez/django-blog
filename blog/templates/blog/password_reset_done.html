{% extends "blog/base.html" %}
{% load static %}

{% block title %}Password Reset Sent - PixelPost{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow">
                <div class="card-body p-4">
                    <i class="fas fa-envelope fa-4x text-success mb-3"></i>
                    <h3>Check Your Email</h3>
                    <p class="text-muted">
                        We've emailed you instructions for setting your password. 
                        You should receive the email shortly.
                    </p>
                    <div class="mt-4">
                        <a href="{% url 'blog:login' %}" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt me-2"></i>Return to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
