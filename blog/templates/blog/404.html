{% extends "blog/base.html" %}
{% load static %}

{% block title %}Page Not Found - MyBlog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="mb-4">
                <i class="fas fa-exclamation-triangle fa-5x text-warning mb-4"></i>
                <h1 class="display-1 fw-bold text-primary">404</h1>
                <h2 class="mb-4">Page Not Found</h2>
                <p class="lead text-muted">
                    Oops! The page you're looking for doesn't exist or has been moved.
                </p>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h5><i class="fas fa-search me-2"></i>What would you like to do?</h5>
                    <div class="d-flex flex-wrap justify-content-center gap-3 mt-3">
                        <a href="{% url 'blog:home' %}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Go Home
                        </a>
                        <a href="{% url 'blog:post_list' %}" class="btn btn-outline-primary">
                            <i class="fas fa-newspaper me-2"></i>Browse Posts
                        </a>
                        <a href="{% url 'blog:contact' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-envelope me-2"></i>Contact Support
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
