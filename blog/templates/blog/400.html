{% extends "blog/base.html" %}
{% load static %}

{% block title %}Bad Request - MyBlog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="mb-4">
                <i class="fas fa-exclamation-circle fa-5x text-warning mb-4"></i>
                <h1 class="display-1 fw-bold text-warning">400</h1>
                <h2 class="mb-4">Bad Request</h2>
                <p class="lead text-muted">
                    The request could not be processed. Please check your input and try again.
                </p>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h5><i class="fas fa-redo me-2"></i>What to do next?</h5>
                    <div class="d-flex flex-wrap justify-content-center gap-3 mt-3">
                        <a href="javascript:history.back()" class="btn btn-primary">
                            <i class="fas fa-arrow-left me-2"></i>Go Back
                        </a>
                        <a href="{% url 'blog:home' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-home me-2"></i>Go Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
