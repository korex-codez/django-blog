{% extends 'blog/base.html' %}

{% block content %}

<h2>Delete Post</h2>

<p>Are you sure you want to delete:</p>

<h4>{{ post.title }}</h4>

<form method="POST">
    {% csrf_token %}
    <button class="btn btn-danger">
        Delete
    </button>

    <a href="{% url 'post_detail' post.id %}" class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
