{% extends 'blog/base.html' %} {% block content %}

<h2>Login</h2>

<form method="POST">
  {% csrf_token %}

  <input
    class="form-control mb-3"
    type="text"
    name="username"
    placeholder="Username"
  />

  <input
    class="form-control mb-3"
    type="password"
    name="password"
    placeholder="Password"
  />

  <button class="btn btn-success">Login</button>
</form>

{% endblock %}
