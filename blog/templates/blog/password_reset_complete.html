{% extends "blog/base.html" %}
{% load static %}

{% block title %}Password Reset Complete - PixelPost{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg success-card">
                <div class="card-body p-5 text-center">
                    <div class="success-icon-wrapper mb-4">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    
                    <h3 class="fw-bold mb-2">Password Reset Complete</h3>
                    <p class="text-muted mb-4">
                        Your password has been set successfully. You can now login with your new password.
                    </p>
                    
                    <div class="mt-3">
                        <a href="{% url 'blog:login' %}" class="btn btn-primary btn-hover-glow py-2 px-4">
                            <i class="fas fa-sign-in-alt me-2"></i>Login Now
                        </a>
                    </div>
                    
                    <hr class="my-4">
                    
                    <p class="text-muted mb-0">
                        <a href="{% url 'blog:home' %}" class="text-decoration-none fw-semibold">
                            <i class="fas fa-home me-1"></i>Return to Home
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Success page specific styles */
    .success-card {
        background: #ffffff;
        border: 1px solid #f0f0f0;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        transition: all 0.3s ease;
    }
    
    .success-card:hover {
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }
    
    .success-icon-wrapper {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(72, 187, 120, 0.08);
        font-size: 2.5rem;
        color: #48bb78;
        transition: all 0.3s ease;
    }
    
    .success-icon-wrapper:hover {
        transform: scale(1.05) rotate(5deg);
        background: rgba(72, 187, 120, 0.12);
    }
    
    .success-card h3 {
        font-size: 1.5rem;
        color: #1a202c;
    }
    
    /* Button */
    .btn {
        border-radius: 10px;
        font-weight: 600;
        padding: 0.625rem 1.5rem;
        transition: all 0.3s ease;
        font-size: 0.95rem;
        letter-spacing: 0.01em;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        color: white;
    }
    
    .btn-hover-glow {
        transition: all 0.3s ease;
    }
    
    .btn-hover-glow:hover {
        transform: translateY(-2px);
    }
    
    /* Divider */
    hr {
        border-color: #f0f0f0;
        opacity: 1;
    }
    
    /* Links */
    a {
        color: #667eea;
        transition: color 0.2s ease;
    }
    
    a:hover {
        color: #5a67d8;
    }
    
    .fw-semibold {
        font-weight: 600;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
        .success-card .card-body.p-5 {
            padding: 2rem !important;
        }
        
        .success-icon-wrapper {
            width: 60px;
            height: 60px;
            font-size: 2rem;
        }
        
        .success-card h3 {
            font-size: 1.25rem;
        }
        
        .btn {
            padding: 0.5rem 1.25rem;
            font-size: 0.875rem;
        }
    }
</style>
{% endblock %}
