{% extends "blog/base.html" %}

{% block title %}
Contact | My Blog
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white text-center">

                    <h2 class="mb-0">

                        📩 Contact Us

                    </h2>

                </div>

                <div class="card-body p-4">

                    <p class="text-center text-muted mb-4">

                        Have a question, suggestion, or feedback?
                        We'd love to hear from you.

                    </p>

                    <form method="POST"
                          action="{% url 'contact_form' %}">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            {{ form.name }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email Address

                            </label>

                            {{ form.email }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Subject

                            </label>

                            {{ form.subject }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Message

                            </label>

                            {{ form.message }}

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Send Message

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
