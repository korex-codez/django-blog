{% extends "blog/base.html" %}
{% load static %}

{% block title %}Unsubscribe from Newsletter - MyBlog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4 text-center">
                    <i class="fas fa-envelope-open-text fa-4x text-danger mb-3"></i>
                    <h3>Unsubscribe from Newsletter</h3>
                    <p class="text-muted">We're sorry to see you go. Enter your email to unsubscribe.</p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">
                            <i class="fas fa-times me-2"></i>Unsubscribe
                        </button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <p class="text-muted">
                        <a href="{% url 'blog:home' %}" class="text-decoration-none">
                            <i class="fas fa-arrow-left me-1"></i>Return to Home
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
