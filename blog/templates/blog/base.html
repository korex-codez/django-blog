{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}My Blog{% endblock %}</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  </head>

  <body>
    <div id="progressBar"></div>
    <div id="loader">
      <div class="spinner-border text-light"></div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark premium-nav sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="/"> 🚀 MyBlog </a>

        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto ms-4">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'about' %}"> About </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'contact' %}"> Contact </a>
            </li>
          </ul>

          <button
            id="themeToggle"
            class="btn btn-outline-light rounded-circle me-3"
            title="Toggle Theme"
          >
            🌙
          </button>

          <form class="d-flex me-3" action="{% url 'home' %}" method="GET">
            <input
              class="form-control rounded-pill"
              type="search"
              name="q"
              placeholder="Search blogs..."
            />

            <button class="btn btn-light rounded-pill ms-2">
              <i class="bi bi-search"></i>
            </button>
          </form>

          {% if user.is_authenticated %}

          <a class="btn premium-btn me-2" href="{% url 'dashboard' %}">
            Dashboard
          </a>

          <a class="btn btn-outline-light me-2" href="{% url 'profile' %}">
            Profile
          </a>

          <a class="btn btn-danger" href="{% url 'logout' %}"> Logout </a>

          {% else %}

          <a class="btn btn-outline-light me-2" href="{% url 'login' %}">
            Login
          </a>

          <a class="btn premium-btn" href="{% url 'register' %}"> Register </a>

          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container py-5">{% block content %} {% endblock %}</div>

    <footer class="footer">
      <div class="container text-center">
        <h4 class="fw-bold">🚀 My Blog</h4>

        <p class="mt-3">Built with Django ❤️ Bootstrap</p>

        <p class="text-secondary">© 2026 All Rights Reserved</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const btn = document.getElementById("themeToggle");

      if (localStorage.getItem("theme") == "dark") {
        document.body.classList.add("dark");

        btn.innerHTML = "☀️";
      }

      btn.onclick = function () {
        document.body.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {
          localStorage.setItem("theme", "dark");

          btn.innerHTML = "☀️";
        } else {
          localStorage.setItem("theme", "light");

          btn.innerHTML = "🌙";
        }
      };
    </script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
      AOS.init({
        duration: 800,
        once: true,
      });
    </script>
    <script>
      window.addEventListener("load", function () {
        document.getElementById("loader").style.display = "none";
      });
    </script>
    <script>
      window.addEventListener("scroll", function () {
        let scrollTop = document.documentElement.scrollTop;

        let height =
          document.documentElement.scrollHeight -
          document.documentElement.clientHeight;

        let progress = (scrollTop / height) * 100;

        document.getElementById("progressBar").style.width = progress + "%";
      });
    </script>
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
